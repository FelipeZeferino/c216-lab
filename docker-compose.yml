services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: alunos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alunos_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  api:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/alunos_db
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    ports:
      - "3000:3000"
  tests:
    build: .
    depends_on:
      db:
        condition: service_healthy
    command: pytest -q
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/alunos_db

volumes:
  postgres_data:
